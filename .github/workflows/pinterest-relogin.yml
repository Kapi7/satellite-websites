name: Pinterest Re-Login

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Pinterest account to re-login (cosmetics | wellness | mirai | all)'
        required: true
        default: 'all'
        type: choice
        options:
          - cosmetics
          - wellness
          - mirai
          - all

permissions:
  contents: write

jobs:
  relogin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCOUNT_INPUT: ${{ inputs.account }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install playwright python-dotenv
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run Pinterest re-login (with Telegram 2FA bridge)
        env:
          PINTEREST_GLOWCODED_EMAIL: ${{ secrets.PINTEREST_GLOWCODED_EMAIL }}
          PINTEREST_GLOWCODED_PASSWORD: ${{ secrets.PINTEREST_GLOWCODED_PASSWORD }}
          PINTEREST_ROOTEDGLOW_EMAIL: ${{ secrets.PINTEREST_ROOTEDGLOW_EMAIL }}
          PINTEREST_ROOTEDGLOW_PASSWORD: ${{ secrets.PINTEREST_ROOTEDGLOW_PASSWORD }}
          PINTEREST_MIRAI_EMAIL: ${{ secrets.PINTEREST_MIRAI_EMAIL }}
          PINTEREST_MIRAI_PASSWORD: ${{ secrets.PINTEREST_MIRAI_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/social/pinterest_relogin_telegram.py --account "$ACCOUNT_INPUT"
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-relogin-screenshots
          path: scripts/social/data/relogin-debug/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit refreshed session state(s)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/social/browser-state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Pinterest: refresh session state [skip ci]"
            git pull --rebase origin main 2>/dev/null || true
            git push
          fi
