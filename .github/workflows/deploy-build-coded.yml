name: Deploy build-coded

# Manual code-only deployment. Reviewed articles are deployed by the publisher.
# Share its release lock so an older independent build cannot replace production.
on:
  workflow_dispatch:

concurrency:
  group: satellite-daily-publisher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: build-coded/package-lock.json

      - name: Install dependencies
        working-directory: build-coded
        # Resolve platform-specific optional dependencies on the Linux runner.
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build site
        working-directory: build-coded
        timeout-minutes: 5
        run: |
          set -x
          node --version
          echo "Astro build start: $(date -u +%H:%M:%S)"
          timeout 240 npx astro build || { echo "::error::astro build timed out or failed"; exit 1; }
          echo "Astro build done: $(date -u +%H:%M:%S)"
          ls -la dist | head -20
          timeout 90 npx pagefind --site dist || echo "::warning::pagefind step failed (non-fatal)"
          echo "Build complete: $(date -u +%H:%M:%S)"

      - name: Deploy to Cloudflare Pages
        working-directory: build-coded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest pages deploy dist --project-name=build-coded --branch=main --commit-dirty=true

      - name: Summary
        if: always()
        run: |
          echo "### build-coded deploy ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
