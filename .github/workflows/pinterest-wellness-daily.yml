name: Pinterest wellness daily poster

on:
  schedule:
    - cron: '45 15 * * *'
    - cron: '15 19 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinterest-wellness
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet playwright python-dotenv requests pillow google-genai openai cryptography pycookiecheat

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore Pinterest session
        env:
          SESSION_B64: ${{ secrets.PINTEREST_WELLNESS_SESSION }}
        run: |
          mkdir -p scripts/social/browser-state/pinterest-wellness
          printf '%s' "$SESSION_B64" | base64 -d > scripts/social/browser-state/pinterest-wellness/state.json
          test -s scripts/social/browser-state/pinterest-wellness/state.json && echo "session ok"

      - name: Map Mac-mini image paths into runner workspace
        env:
          WS: ${{ github.workspace }}
        run: |
          sudo mkdir -p /Users/agentdavid/mirai-seo /Users/kapi7
          sudo ln -snf "$WS" /Users/agentdavid/mirai-seo/satellite-websites
          sudo ln -snf "$WS" /Users/kapi7/satellite-websites

      - name: Run pinterest poster
        env:
          PINTEREST_ROOTEDGLOW_EMAIL: ${{ secrets.PINTEREST_ROOTEDGLOW_EMAIL }}
          PINTEREST_ROOTEDGLOW_PASSWORD: ${{ secrets.PINTEREST_ROOTEDGLOW_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/social/pinterest_poster.py --run-due --site wellness

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-wellness-debug-${{ github.run_id }}
          path: scripts/social/data/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit schedule status updates
        if: always()
        run: |
          if git diff --quiet scripts/social/pinterest_schedule.json; then
            echo "No schedule changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git stash push --include-untracked -m "wellness-runtime-side-effects" || true
            git checkout stash@{0} -- scripts/social/pinterest_schedule.json 2>/dev/null || true
            git add scripts/social/pinterest_schedule.json
            git commit -m "Pinterest wellness: status updates [skip ci]"
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git pull --rebase=false origin main -X ours; }
            git push origin main || { sleep 3; git pull --rebase origin main && git push origin main; }
          fi
