name: Deploy satellites code

# Manual code-only deploy for glow-coded (cosmetics) + rooted-glow (wellness).
# Shares the publisher release lock so an older build cannot race production.
on:
  workflow_dispatch:
  # One-shot: publish the merged glass-skin rewrite. Revert this push trigger
  # immediately after the production deploy is queued.
  push:
    branches:
      - main

concurrency:
  group: satellite-daily-publisher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: cosmetics
            project: glow-coded
            lockfile: cosmetics/package-lock.json
          - dir: wellness
            project: rooted-glow
            lockfile: wellness/package-lock.json
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build site
        working-directory: ${{ matrix.dir }}
        timeout-minutes: 10
        run: |
          set -x
          node --version
          echo "Astro build start: $(date -u +%H:%M:%S)"
          timeout 480 npx astro build || { echo "::error::astro build timed out or failed"; exit 1; }
          echo "Astro build done: $(date -u +%H:%M:%S)"
          ls -la dist | head -20
          timeout 90 npx pagefind --site dist || echo "::warning::pagefind step failed (non-fatal)"

      - name: Deploy to Cloudflare Pages
        working-directory: ${{ matrix.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest pages deploy dist --project-name=${{ matrix.project }} --branch=main --commit-dirty=true

      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.project }} deploy ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dir: ${{ matrix.dir }}" >> $GITHUB_STEP_SUMMARY
