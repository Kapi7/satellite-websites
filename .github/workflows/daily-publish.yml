name: Daily Article Publisher

on:
  schedule:
    - cron: '0 3 * * *'  # 6:00 AM EEST
  workflow_dispatch:
    inputs:
      repair_batch:
        description: Generate the reviewed Glow repair batch as an artifact only
        type: boolean
        default: false
      notifications:
        description: Send the existing Telegram notifications
        type: boolean
        default: false

concurrency:
  group: satellite-daily-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !inputs.repair_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install google-genai python-dotenv

      - name: Write .env from secrets
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf 'GEMINI_API_KEY=%s\nTELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' \
            "$GEMINI_KEY" "$TG_TOKEN" "$TG_CHAT" > .env

      - name: Write GSC token
        run: echo '${{ secrets.GSC_TOKEN_JSON }}' | base64 -d > /tmp/gsc-token.json
        env:
          GSC_TOKEN_FILE: /tmp/gsc-token.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run daily publisher
        run: bash scripts/daily-publish.sh
        env:
          DISABLE_OUTBOUND_NOTIFICATIONS: ${{ github.event_name == 'workflow_dispatch' && !inputs.notifications && '1' || '0' }}
          GSC_TOKEN_FILE: /tmp/gsc-token.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push changes if any (retry-resilient against Mac Mini race)
        run: |
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-publish daily articles [skip ci]"
          bash scripts/push-publisher.sh

      - name: Preserve generated content after a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-content-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            cosmetics/src/content/blog/
            wellness/src/content/blog/
            build-coded/src/content/blog/

  repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-genai python-dotenv requests Pillow
      - name: Generate review artifacts
        run: python scripts/repair_glow_batch.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glow-repairs-review
          retention-days: 7
          path: |
            cosmetics/src/content/blog/
            cosmetics/public/images/editorial/
            repair-results.json
