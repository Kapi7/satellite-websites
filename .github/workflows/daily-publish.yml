name: Daily Article Publisher

on:
  schedule:
    - cron: '0 3 * * *'  # 6:00 AM EEST
  workflow_dispatch:
    inputs:
      repair_batch:
        description: Generate the reviewed Glow repair batch as an artifact only
        type: boolean
        default: false
      notifications:
        description: Reserved compatibility input; reviewed releases never send notifications
        type: boolean
        default: false

concurrency:
  group: satellite-daily-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !inputs.repair_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check release safeguards
        run: |
          python3 scripts/test_reviewed_publisher.py
          python3 scripts/test_notification_suppression.py
          python3 scripts/test_content_quality.py

      - name: Run daily publisher
        run: bash scripts/daily-publish.sh
        env:
          DISABLE_OUTBOUND_NOTIFICATIONS: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Preserve reviewed content after a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-content-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            cosmetics/src/content/blog/
            wellness/src/content/blog/
            build-coded/src/content/blog/

  repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-genai python-dotenv requests Pillow
      - name: Generate review artifacts
        run: python scripts/repair_glow_batch.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glow-repairs-review
          retention-days: 7
          path: |
            cosmetics/src/content/blog/
            cosmetics/public/images/editorial/
            repair-results.json
