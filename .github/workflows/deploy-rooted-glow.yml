name: Rooted-glow CF Pages diagnostic

# rooted-glow is a GIT-CONNECTED CF Pages project (unlike build-coded, which is
# direct-upload). Wrangler cannot direct-upload to git-connected projects
# (API error 8000000, confirmed June 12 2026), so this workflow does NOT deploy.
# It exists to read CF Pages deployment status with the account token that only
# CI has — use it to see whether CF's own git builds are succeeding and when
# the last successful deployment happened.
#
# If rooted-glow's git integration ever breaks permanently (like build-coded's
# did), the fix is: disconnect git in the CF dashboard, then restore the
# build+wrangler-deploy steps from deploy-build-coded.yml.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent rooted-glow deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages deployment list --project-name=rooted-glow 2>&1 | head -30
          echo "---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/rooted-glow/deployments?per_page=5" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          for d in data.get('result', []):
              stage = d.get('latest_stage', {})
              print(f\"{d.get('created_on','?')[:19]}  {stage.get('name','?'):10s} {stage.get('status','?'):9s} commit={ (d.get('deployment_trigger',{}).get('metadata',{}).get('commit_hash') or '?')[:8] }\")
          "
