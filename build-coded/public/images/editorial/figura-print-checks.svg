<text x="30" y="99" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#243033">THREE CHECKS.</text><text x="30" y="139" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#c45d37">BEFORE THE PRINTER STARTS.</text>
