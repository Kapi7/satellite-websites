<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Three checks before printing a drawing-based figurine</title>
<desc id="desc">Original Build Coded editorial diagram. Compare the model with the drawing, inspect the sliced layers, then confirm the printer setup. This is not a screenshot or a physical printing result.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ded8c9" stroke-width=".6"/></pattern></defs>
